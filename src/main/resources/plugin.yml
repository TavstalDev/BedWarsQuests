main: io.github.tavstaldev.bedWarsQuests.BedWarsQuests
version: 1.0.0

name: BedWarsQuests
api-version: '1.21'
prefix: BedWarsQuests
authors: [ Tavstal ]
description:
website: https://tavstaldev.github.io/
softdepend: [BedWars, ScreamingBedWars, BanyaszLib]
commands:
  bedwarsquests:
    description: Opens the BedWars arena selection GUI.
    usage: /bedwarsquests
    permission: bedwarsquests.commands.gui
    aliases: [ "bwgui", "bedgui", "bwarenas" ]
    subcommands:
      help:
        description: "Show help for the bedwarsquests command"
        usage: "/bedwarsquests help"
        permission: bedwarsquests.commands.help
      version:
        description: "Show the version of the plugin"
        usage: "/bedwarsquests version"
        permission: bedwarsquests.commands.version
      reload:
        description: "Reload the plugin"
        usage: "/bedwarsquests reload"
        permission: bedwarsquests.commands.reload
      open:
        description: "Open the BedWars quest GUI"
        usage: "/bedwarsquests open"
        permission: bedwarsquests.commands.gui
permissions:
  bedwarsquests.commands.reload:
    default: op
  bedwarsquests.commands.version:
    default: op
  bedwarsquests.commands.help:
    default: true
  bedwarsquests.commands.gui:
    description: Allows the player to use the /bedwarsquests command.
    default: true
  bedwarsquests.player:
    description: Collection of player permissions
    default: true
    children:
      bedwarsquests.commands.gui: true
      bedwarsquests.commands.help: true
  bedwarsquests.admin:
    description: Collection of admin permissions
    default: op
    children:
      bedwarsquests.commands.reload: true
      bedwarsquests.commands.version: true
  bedwarsquests.*:
    description: Gives all permissions related to the bedwarsquests plugin.
    default: op
    children:
      bedwarsquests.player: true
      bedwarsquests.admin: true
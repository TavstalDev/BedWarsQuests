    Desc: "Shows the plugin version."
    Current: "%prefix% &aYou are using version '&3%version%&a' of BedWarsQuests."
    UpToDate: "%prefix% &aBedWarsQuests is up-to-date."
    Outdated: "%prefix% &cBedWarsQuests is outdated. You can download it here: &e%link%"
  Reload:
    Desc: "Reloads the plugin config and messages."
    Done: "%prefix% &aPlugin updated."
  Reset:
    Desc: "Resets the player's quests and achievements."
    Confirmation: "%prefix% &cAre you sure you want to reset your quests and achievements? Confirm with &e/bwgui reset confirm&c."
    Done: "%prefix% &aSuccessfully reset your plugin data."
  Gui:
    Desc: "Opens the GUI."


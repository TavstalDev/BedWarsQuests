data:
  'first_win':
    name: 'Első győzelem!'
    description: '&7Nyerd meg az első játékodat.'
    triggers: [ 'game_end' ]
    criteria:
      type: 'win'
      single_match: false
      operator: '>='
      count: 1
    rewards:
      - type: 'vault'
        amount: 50.0
  'first_bed_destroy':
    name: 'Első ágy törés!'
    description: '&7Törd el az első ágyadat.'
    triggers: [ 'bed_destroy', 'game_end' ]
    criteria:
      type: 'bed_break'
      single_match: false
      operator: '>='
      count: 1
    rewards:
      - type: 'vault'
        amount: 30.0
  'first_blood':
    name: 'Első vér!'
    description: '&7Öld meg az első ellenfeledet.'
    triggers: [ 'player_death', 'game_end' ]
    criteria:
      type: 'kill'
      single_match: false
      operator: '>='
      count: 1
    rewards:
      - type: 'vault'
        amount: 20.0